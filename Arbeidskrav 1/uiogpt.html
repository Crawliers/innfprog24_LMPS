<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Tell tegn i ord</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
        }

        #resultat {
            margin-top: 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tegn-teller</h1>
        <label for="ordInput">Skriv inn et ord:</label>
        <input type="text" id="ordInput" placeholder="Skriv et ord her">
        <button onclick="tellTegn()">Tell tegn</button>
        <p id="resultat"></p>
    </div>

    <script>
        function tellTegn() {
            var ord = document.getElementById('ordInput').value;
            var antallTegn = ord.length;

            var resultatTekst = 'Ordet ' + ord + ' består av ' + antallTegn + ' tegn';

            document.getElementById('resultat').textContent = resultatTekst;
        }
    </script>
</body>
</html>
