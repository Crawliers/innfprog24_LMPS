<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tell tegn i et ord</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #333333;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        #resultat {
            margin-top: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #222222;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ord- og tegn-teller</h1>
        <input type="text" id="tekstFelt" placeholder="Skriv inn et ord her...">
        <button onclick="tellTegn()">Tell tegn</button>
        <p id="resultat"></p>
    </div>

    <script>
        function tellTegn() {
            // Henter verdien fra tekstfeltet
            const inndata = document.getElementById('tekstFelt').value.trim();
            const resultatElement = document.getElementById('resultat');

            // Sjekker om feltet er tomt
            if (inndata === "") {
                resultatElement.textContent = "Vennligst skriv inn et ord eller en tekst først.";
                return;
            }

            // Finner lengden på teksten
            const antallTegn = inndata.length;

            // Skriver ut den ønskede meldingen
            resultatElement.textContent = `Ordet ${inndata} består av ${antallTegn} tegn`;
        }
    </script>

</body>
</html>
