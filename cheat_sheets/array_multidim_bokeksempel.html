<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Cheat Sheet: Multidimensjonal Array</title>

    <style>
        #books, #longreads {
            display: flex;
            gap: .5rem;

        }

        article {
            border: 1px solid #ccc;
            background: #f3f3f3;
            padding: .5rem;
            box-sizing: border-box;
            width: 33%;
        }
    </style>
</head>
<body>
    <h2>Referansetest</h2>
    <p>Henter tittel på bok 3: <span id="book3Title"></span></p>
    <p>Henter forfatter 2 på bok 2: <span id="book2Author2"></span></p>
    <p>Henter alle forfattere til bok 2: <span id="book2AllAuthors"></span></p>

    <h2>Bokregister</h2>
    <section id="books">
        <p>Laster inn bøker...</p>
    </section>

    <h2>Langlesning</h2>
    <section id="longreads">
        <p>Laster inn bøker...</p>
    </section>

    <script>
        const bokregister = [
            {
                title: "Fourth Wing",
                author: ["Rebecca Yarros"],
                pagecount: 512,
                //isbn: 9783423220996,
                isbn: 9780349437019,
            },

            {
                title: "Silver Eyes",
                author: ["Scott Cawthorn", "Kira Wristley"],
                pagecount: 365,
                isbn: 9781338134377
            },

            {
                title: "Harry Potter: De vises Stein",
                author: ["JK Rowling"],
                pagecount: 333,
                isbn: 9788202434687,
                //isbn: 9780545582889,
            }
        ]

        console.log(bokregister)

        //Henter tittel på bok 3:
        document.getElementById("book3Title").innerHTML = bokregister[2].title

        //Henter forfatter 2 på bok 2:
        document.getElementById("book2Author2").innerHTML = bokregister[1].author[1]
        document.getElementById("book2AllAuthors").innerHTML = bokregister[1].author.join(", ")

        //Bruker .map for å hente alle bøker, og bygger HTML i booksHTML-variabelen
        let booksHTML = ""
        bokregister.map(b => { booksHTML += 
            `<article>
                <img src="https://covers.openlibrary.org/b/isbn/${b.isbn}-M.jpg" />
                <h3>${b.title}</h3>
                <p class="isbnnummer">${b.isbn}</p>
                <p>${b.author.length === 1 ? "Forfatter" : "Forfattere"}: ${b.author.join(", ")}</p>
                <p>Sidetall: ${b.pagecount}</p>
            </article>`
            //<p>${b.author[0] + [", "] + b.author[1]}</p> forsøkt over forfattere. Gir undefined.
            //Template literal for konkatinering og bedre oversikt
            //Turnery Operator === forkortet IF-test, bruker ":" som else
        })
        console.log(booksHTML)
        document.getElementById("books").innerHTML = booksHTML

        //Bruker .filter for å filtrere ut bøker med mer enn 400 sider.
        let longreadHTML = ""
        const longReads = bokregister.filter(l => l.pagecount >= 400)
        console.log("Longread: ", longReads)
        longReads.map(l => {
            longreadHTML += `<article>
                <img src="https://covers.openlibrary.org/b/isbn/${l.isbn}-M.jpg" />
                <h3>${l.title}</h3>
                <p class="isbnnummer">${l.isbn}</p>
                <p>${l.author.length === 1 ? "Forfatter" : "Forfattere"}: ${l.author.join(", ")}</p>
                <p>Sidetall: ${l.pagecount}</p>
            </article>`
        })
        document.getElementById("longreads").innerHTML = longreadHTML

        //Filtrere ut bøker med mer enn 1 forfatter.
        let multiAuthorHTML =""
        const multiAuthor = bokregister.filter(t => t.author.length > 1)
        console.log("Multiple Authors", multiAuthor)

        
    </script>>
</body>
</html>
