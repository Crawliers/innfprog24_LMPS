<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheat Sheet for Functions</title>
</head>
<body>
    <p>Hei, <span id="username">ikke-innlogget bruker</span></p>
    <p>Hei, <span id="parameter-username">ikke-innlogget bruker som parameter</span></p>
    <p>Hei, <span id="full-parameter-username">ikke-innlogget bruker, men utfylt parameter</span></p>

    <script>
        //Her skal vi lage verdens enkleste funksjon: den skriver ut et navn
        function printName() {
            document.getElementById("username").innerHTML = "Mathias"

        }
        printName()

        //Lage en funksjon som tar imot navn som et parameter
        function printParameterName(name) {
            document.getElementById("parameter-username").innerHTML = name
        }
        printParameterName("Liam Mathias")

        //Lage en funksjon med standardverdi for et parameter, kan brukes som failsafe
        function printDefaultName(name = "brukernavn") {
            document.getElementById("full-parameter-username").innerHTML = name
        }
        printDefaultName("Skjerdal")

        //Lage en funksjon som oppretter et nytt HTML-element, og fyller dette med navn fra parameter før det skrives ut til HTML:
        function printElementName(name = "Mathias", htmltag ="h2") {
            const element = document.createElement(htmltag)
            element.innerHTML = name
            document.body.appendChild(element)
        }
        printElementName()
        printElementName("Skjerdal", "h1")
        //Variablene i en funksjon er kun tilgjengelige i funksjonens scope. De vil derfor ikke kunne brukes utenfor funksjonens parameter uten at de hentes ut
    </script>
</body>
</html>
